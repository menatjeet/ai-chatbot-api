services:
  - type: web
    name: ai-chatbot-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_NAME
        value: "AI Chatbot API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "False"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-chatbot-db
          property: connectionString

databases:
  - name: ai-chatbot-db
    plan: free
    region: oregon
    databaseName: chatbot_db
    user: chatbot_user
